name: Monorepo Validate

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker?schema=public
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters
      DEMO_USER_PASSWORD: ci-demo-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @tracker/db exec prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: pnpm --filter @tracker/db prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm --filter @tracker/api test

      - name: Build
        run: pnpm -r build

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/base >/tmp/tracker-k8s.yaml
