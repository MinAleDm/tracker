apiVersion: v1
kind: ConfigMap
metadata:
  name: tracker-config
data:
  POSTGRES_DB: tracker
  POSTGRES_USER: tracker
  NODE_ENV: production
  PORT: "3001"
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  JWT_ISSUER: tracker-api
  JWT_AUDIENCE: tracker-web
  COOKIE_SECURE: "true"
  SWAGGER_ENABLED: "false"
  TRUST_PROXY_HOPS: "1"
  SEED_DEMO_DATA: "false"
  CORS_ORIGIN: https://tracker.example.com
