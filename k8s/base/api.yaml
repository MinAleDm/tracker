apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: tracker
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: tracker-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: NODE_ENV
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?schema=public
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: tracker-secret
                  key: JWT_REFRESH_SECRET
            - name: JWT_ACCESS_TTL
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: JWT_ACCESS_TTL
            - name: JWT_REFRESH_TTL
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: JWT_REFRESH_TTL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: JWT_AUDIENCE
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: CORS_ORIGIN
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: COOKIE_SECURE
            - name: SWAGGER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: SWAGGER_ENABLED
            - name: TRUST_PROXY_HOPS
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: TRUST_PROXY_HOPS
            - name: SEED_DEMO_DATA
              valueFrom:
                configMapKeyRef:
                  name: tracker-config
                  key: SEED_DEMO_DATA
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
